    <style>

        white-space: nowrap;
      }
    </style>

    <meta
      name="description"
      content="Strona Marzanny Jakoniuk - psychoterapeuty specjalizującej się w terapii metodą Gestalt. Poznaj jej usługi i doświadczenie zawodowe."
    />

    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "Person",
        "name": "Marzanna Jakoniuk",
        "jobTitle": ["Psycholog", "Psychoterapeutka"],
        "url": "https://artwol993.github.io/mj/",
        "image": "https://psychoterapiacotam.pl/wp-content/uploads/2022/05/Marzanna-Jakoniuk-2023.jpg",
        "workLocation": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Warszawa",
            "streetAddress": "ul. Agrestowa 4"
          }
        },
        "sameAs": [
          "https://www.linkedin.com/in/marzanna-jakoniuk-a3b543102/?originalSubdomain=pl"
        ],
        "memberOf": [
          {
            "@type": "Organization",
            "name": "Szkola Psychoterapii Gestalt",
            "member": ["EAGT", "EAP"]
          }
        ],
        "description": "Jestem psychologiem i psychoterapeutką w trakcie 4-letniego szkolenia w Szkole Psychoterapii Gestalt. Specjalizuję się w terapii metodą Gestalt oraz Terapii Skoncentrowanej na Rozwiązaniach (TSR)."
      }
    </script>

    <meta name="author" content="Artur Woliński @arturwoli" />
    <!-- fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:400,500,700&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--favicon-->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>

    <div
      id="cookie-banner"
      style="
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: #f8d7da;
        color: #721c24;
        text-align: center;
        padding: 15px;
        z-index: 1000;
      "
    >
      <span
        >Nasza strona używa plików cookie, aby zapewnić najlepsze doświadczenia.
        Kontynuując przeglądanie, zgadzasz się na ich użycie.
        <a
          href="https://marzannajakoniuk.pl/polityka-cookies"
          target="_blank"
          style="color: #721c24; text-decoration: underline"
          >Przeczytaj więcej</a
        >.</span
      >
      <button
        id="accept-cookies"
        style="
          margin-left: 20px;
          background-color: #721c24;
          color: white;
          border: none;
          padding: 5px 10px;
          cursor: pointer;
        "
      >
        Zgadzam się
      </button>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Sprawdź, czy cookies zostały już zaakceptowane
        if (!localStorage.getItem("cookiesAccepted")) {
          document.getElementById("cookie-banner").style.display = "block";
        }

        // Akceptacja cookies
        document
          .getElementById("accept-cookies")
          .addEventListener("click", function () {
            localStorage.setItem("cookiesAccepted", "true");
            document.getElementById("cookie-banner").style.display = "none";
          });
      });
    </script>
  </body>
</html>
